# Nginx interno del contenedor: solo sirve el SPA
# El Nginx del host (certify.jalisco.gob.mx) se encarga de rutear /api/ y /storage/ al backend

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: todas las rutas devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estaticos (Vite genera hashes en los nombres)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
