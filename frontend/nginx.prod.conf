# nginx.prod.conf
# Este contenedor sirve el SPA y hace de reverse proxy hacia el backend.
# El Nginx/Caddy del HOST se encarga de SSL (443 → 80 aquí dentro).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------
    # Proxy al backend: API
    # -----------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necesario para uploads de imágenes y PDFs
        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # -----------------------------------------------
    # Proxy al backend: archivos de storage (logos, firmas)
    # -----------------------------------------------
    location /storage/ {
        proxy_pass http://backend:3000/storage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -----------------------------------------------
    # SPA fallback: todas las rutas sirven index.html
    # -----------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------------------------------
    # Cache para assets estáticos (Vite genera hashes)
    # -----------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
