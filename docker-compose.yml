# Entorno de DESARROLLO. El repo se monta completo en /app (codigo y storage compartidos
# con el host). Los node_modules viven en volumenes de Docker: instalar sobre el bind mount
# de Windows es lentisimo. Para tener tipos en el editor, abrir el repo con Dev Containers.
#   npm run setup     -> instala dependencias (dentro del contenedor)
#   npm run up:build  -> levanta todo

x-node-app: &node-app
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - backend_node_modules:/app/backend/node_modules
    - frontend_node_modules:/app/frontend/node_modules
    - shared_node_modules:/app/packages/shared/node_modules
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    STORAGE_ROOT: /app/storage
    PRISMA_HIDE_UPDATE_MESSAGE: "true"

services:
  database:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - ./database/data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    <<: *node-app
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "5555:5555"   # Prisma Studio (npm run db:studio)
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  node_modules:
  backend_node_modules:
  frontend_node_modules:
  shared_node_modules:
